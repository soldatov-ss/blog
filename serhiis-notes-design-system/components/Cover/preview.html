<!-- @dsCard height=300 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Serhii's Notes</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--canvas); color:var(--ink); font-family:var(--font-text); overflow:hidden; }
  .cover { position:relative; height:300px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:300px; overflow:hidden; }
  .art svg { display:block; width:480px; height:300px; }
  .stage { fill:var(--ink); }
  .stage-blk { rx:var(--radius-md); }
  .accent { fill:var(--accent); }
  .blush { fill:var(--blush); }
  .lagoon { fill:var(--lagoon); }
  .gilt { fill:none; stroke:var(--gold); stroke-width:1; }
  .words { position:absolute; left:var(--space-32); bottom:var(--space-32); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:96px; line-height:.92; font-weight:500; letter-spacing:-.02em; color:var(--ink); }
  .name em { font-style:italic; color:var(--accent); }
  .tag { margin:var(--space-12) 0 0 4px; font-family:var(--font-ui); font-size:13px; line-height:20px; letter-spacing:1.6px; text-transform:uppercase; color:var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 300" width="480" height="300">
<!--
  blocks      ink stage 272×277 bled off top and right (the obscur: dark by day, lit by night) · accent arch 144×240 (the rose, tallest) · blush arch 104×172 and lagoon arch 104×128 standing on the stage — ≈37% of 960×300
  arrangement one tall rose arch beside a dark stage holding two smaller arches, all bottoms on one gilt baseline space-24 above the edge
  pattern     arches, from the arch plates (`radius-arch`) and Belle Époque frames: three arches plus one gilt arch outline and a gilt baseline — shapes, no pictures
  scales      gutters space-24 / space-16, stage corner radius-md, arch tops = half of each width, gilt lines 1px in gold
-->
<rect class="stage stage-blk" x="208" y="-8" width="280" height="284" rx="6"/>
<path class="accent" d="M40 276 V108 A72 72 0 0 1 184 108 V276 Z"/>
<path class="gilt" d="M52 276 V120 A60 60 0 0 1 172 120 V276"/>
<path class="blush" d="M232 276 V156 A52 52 0 0 1 336 156 V276 Z"/>
<path class="lagoon" d="M352 276 V200 A52 52 0 0 1 456 200 V276 Z"/>
<line class="gilt" x1="24" y1="276.5" x2="480" y2="276.5"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Serhii's<br><em>Notes</em></h1>
  <p class="tag">Long-form notes on building software</p>
</div>
</div>
</body>
</html>

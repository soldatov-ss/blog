<!-- @dsCard height=288 -->
<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--surface-canvas)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--surface-canvas)}
.cv svg{position:absolute;inset:0}
.b-rose{fill:var(--rose)} .b-thread{fill:var(--thread)} .b-ink{fill:var(--ink)} .b-teal{fill:var(--teal)} .b-blush{fill:var(--rose-blush)}
.tile{rx:var(--radius-lg)}
.st{fill:none;stroke-width:1.5;stroke-dasharray:7 5;stroke-linecap:round;rx:10px}
.s-on-rose{stroke:var(--on-rose)} .s-canvas{stroke:var(--surface-canvas)} .s-thread{stroke:var(--thread)}
.txt{position:absolute;left:48px;bottom:40px;max-width:440px}
.name{font-family:var(--font-display);font-variation-settings:"SOFT" 100;font-weight:500;font-size:120px;line-height:.92;letter-spacing:-0.045em;color:var(--ink);margin:0}
.tag{font-family:var(--font-sans);font-size:14px;line-height:20px;letter-spacing:.02em;color:var(--ink-muted);margin:12px 0 0}
</style></head><body>
<div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: rose, thread, ink, teal, rose-blush as hanging banners; widths 96/64/128/64/48 = space-24, space-16, space-8×4, space-16, space-12; corners radius-lg
     arrangement: a strip of unequal silk banners bleeding off the top edge at staggered lengths, like the drapes of Sirene's coliseum
     pattern: running stitch (dash 7 / gap 5, the .sr-seam geometry) sewn space-2 (8px) inside every banner — chosen because the README says "sewn, not drawn"
     steps & radii: gaps space-4 (16px); stitch inset space-2; radius-lg on banners, radius-lg − space-2 on stitches -->
<rect class="b-rose tile" x="512" y="-24" width="96" height="248"/>
<rect class="st s-on-rose" x="520" y="-16" width="80" height="232"/>
<rect class="b-thread tile" x="624" y="-24" width="64" height="184"/>
<rect class="st s-canvas" x="632" y="-16" width="48" height="168"/>
<rect class="b-ink tile" x="704" y="-24" width="128" height="280"/>
<rect class="st s-thread" x="712" y="-16" width="112" height="264"/>
<rect class="b-teal tile" x="848" y="-24" width="64" height="216"/>
<rect class="st s-canvas" x="856" y="-16" width="48" height="200"/>
<rect class="b-blush tile" x="928" y="-24" width="48" height="152"/>
</svg>
<div class="txt"><h1 class="name">Sirene</h1><p class="tag">Silk, seams and gold thread for a slow-reading software blog.</p></div>
</div>
</body></html>
